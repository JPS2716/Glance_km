<!doctype html>

<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Glance | Authentication</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./auth.js" defer></script>

</head>

<body
  class="bg-surface selection:bg-primary/30 min-h-screen flex flex-col justify-center items-center relative overflow-hidden">

  <!-- Decorative Background Grid -->
  <div class="absolute inset-0 opacity-[0.03] pointer-events-none"
    style="background-image: radial-gradient(#a2c9ff 1px, transparent 1px); background-size: 24px 24px;"></div>

  <!-- Go Back Button -->
  <a href="index.html"
    class="absolute top-8 left-8 flex items-center gap-2 text-on-surface hover:text-primary transition-colors font-medium">
    <span class="material-symbols-outlined text-sm">arrow_back</span>
    Back to Home
  </a>

  <!-- Auth Card -->
  <div
    class="w-full max-w-md bg-surface-container/60 backdrop-blur-2xl p-10 rounded-3xl border border-outline-variant/10 shadow-[0_0_60px_rgba(0,0,0,0.4)] z-10">
    <div class="text-center mb-10">
      <div
        class="inline-flex w-16 h-16 bg-surface-container-highest rounded-full items-center justify-center mb-6 shadow-xl border border-primary/20">
        <span class="material-symbols-outlined text-primary text-3xl">lock</span>
      </div>
      <h1 id="auth-title" class="text-3xl font-black font-headline tracking-tighter text-on-surface mb-2">Welcome Back
      </h1>
      <p id="auth-subtitle" class="text-sm text-on-surface-variant">Sign in to sync your intelligent analysis vault.</p>
    </div>

    <!-- Toggle Controls -->
    <div class="flex p-1 bg-surface-container-lowest rounded-xl mb-8 border border-outline-variant/5">
      <button id="toggle-login"
        class="flex-1 py-2 text-sm font-bold rounded-lg bg-surface-container text-on-surface shadow-sm transition-all"
        onclick="setAuthMode('login')">Log In</button>
      <button id="toggle-signup"
        class="flex-1 py-2 text-sm font-bold rounded-lg text-on-surface-variant hover:text-on-surface transition-all"
        onclick="setAuthMode('signup')">Create Account</button>
    </div>

    <form id="auth-form" class="space-y-6" onsubmit="handleAuthSubmit(event)">
      <div class="space-y-2">
        <label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant">Email Address</label>
        <input id="email" required type="email" placeholder="Identifier"
          class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-xl px-4 py-3 focus:ring-1 focus:ring-primary/40 focus:border-primary/40 text-on-surface placeholder:text-outline-variant transition-all hover:bg-surface-container-highest/30" />
      </div>

      <div class="space-y-2">
        <div class="flex justify-between items-end">
          <label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant">Password</label>
          <a href="#" class="text-[10px] text-primary hover:underline uppercase tracking-widest font-bold">Forgot?</a>
        </div>
        <input id="password" required type="password" placeholder="••••••••"
          class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-xl px-4 py-3 focus:ring-1 focus:ring-primary/40 focus:border-primary/40 text-on-surface placeholder:text-outline-variant transition-all hover:bg-surface-container-highest/30" />
      </div>

      <button id="auth-submit-btn" type="submit"
        class="w-full editorial-gradient py-4 rounded-xl font-bold text-on-primary hover:opacity-90 hover:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4 shadow-lg shadow-primary/20 border border-primary/20">
        Sign In
        <span class="material-symbols-outlined text-sm">arrow_forward</span>
      </button>
    </form>
  </div>

  <script>
    let mode = 'login'; // 'login' or 'signup'

    // Auto-redirect if already logged in
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (window.SupabaseAuth && window.SupabaseAuth.getCurrentUser()) {
          window.location.href = 'upload.html';
        }
      }, 1000);
    });

    function setAuthMode(newMode) {
      mode = newMode;
      const toggleLogin = document.getElementById('toggle-login');
      const toggleSignup = document.getElementById('toggle-signup');
      const title = document.getElementById('auth-title');
      const subtitle = document.getElementById('auth-subtitle');
      const submitBtnNode = document.getElementById('auth-submit-btn');

      // Active Styles
      const activeClasses = ['bg-surface-container', 'text-on-surface', 'shadow-sm'];
      const inactiveClasses = ['text-on-surface-variant', 'bg-transparent', 'shadow-none'];

      if (mode === 'login') {
        toggleLogin.classList.add(...activeClasses);
        toggleLogin.classList.remove(...inactiveClasses);
        toggleSignup.classList.remove(...activeClasses);
        toggleSignup.classList.add(...inactiveClasses);

        title.textContent = 'Welcome Back';
        subtitle.textContent = 'Sign in to sync your intelligent analysis vault.';
        submitBtnNode.innerHTML = 'Sign In <span class="material-symbols-outlined text-sm">arrow_forward</span>';
      } else {
        toggleSignup.classList.add(...activeClasses);
        toggleSignup.classList.remove(...inactiveClasses);
        toggleLogin.classList.remove(...activeClasses);
        toggleLogin.classList.add(...inactiveClasses);

        title.textContent = 'Join Glance';
        subtitle.textContent = 'Establish access to the neural network.';
        submitBtnNode.innerHTML = 'Create Account <span class="material-symbols-outlined text-sm">person_add</span>';
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('auth-submit-btn');
      const originalText = btn.innerHTML;

      btn.innerHTML = '<span class="material-symbols-outlined text-sm animate-spin">sync</span> Validating...';
      btn.disabled = true;

      try {
        if (!window.SupabaseAuth) {
          throw new Error("Supabase is not initialized. Please check your auth.js configuration.");
        }

        if (mode === 'login') {
          const success = await window.SupabaseAuth.handleLogin(email, pass);
          if (success) {
            window.location.href = 'upload.html';
          } else {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }
        } else {
          const success = await window.SupabaseAuth.handleSignup(email, pass);
          if (success) {
            window.location.href = 'upload.html';
          } else {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }
        }
      } catch (error) {
        console.error(error);
        alert("A system error occurred: " + error.message);
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }
  </script>
</body>

</html>
